name: Refresh News Insights

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday at 04:00 UTC (after the Sunday tradeflows refresh)
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  refresh:
    name: Generate cached executive insights
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run insights refresh
        env:
          SUPABASE_URL: https://lsyombbeyjokpndczvdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/refresh_insights.py
