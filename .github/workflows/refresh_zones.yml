name: Refresh Zones Data

# Oceanbolt zone tonnage / zone crossings -> Supabase zones_* tables, all platforms (dry, tank, lng, lpg).
# Incremental: each series resumes from its last stored date (minus an overlap), so a missed week heals itself.
on:
  schedule:
    - cron: "0 5 * * 0"   # every Sunday at 05:00 UTC (after the 03:00 tradeflows refresh)
  workflow_dispatch:        # manual trigger from GitHub UI
    inputs:
      platforms:
        description: "Platforms to refresh (space separated)"
        required: false
        default: "dry tank lng lpg"
      steps:
        description: "Steps (dims count changes pairs)"
        required: false
        default: "dims count changes pairs"
      full:
        description: "Download the FULL history (ignore stored dates). Run one platform at a time: a platform takes about 1-3 hours"
        type: boolean
        required: false
        default: false
      overlap_days:
        description: "Days re-downloaded before each series' last stored date"
        required: false
        default: "14"

concurrency:
  group: refresh-zones
  cancel-in-progress: false

jobs:
  refresh:
    name: Oceanbolt → Supabase (zones)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/zones/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/zones/requirements.txt

      - name: Run refresh
        working-directory: automation/zones
        env:
          OCEANBOLT_TOKEN: ${{ secrets.OCEANBOLT_TOKEN }}
          SUPABASE_URL: https://lsyombbeyjokpndczvdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'dry tank lng lpg' }}
          STEPS: ${{ github.event.inputs.steps || 'dims count changes pairs' }}
          FULL_FLAG: ${{ github.event.inputs.full == 'true' && '--full' || '' }}
          OVERLAP: ${{ github.event.inputs.overlap_days || '14' }}
        run: python refresh_zones.py --platforms $PLATFORMS --steps $STEPS --overlap $OVERLAP $FULL_FLAG
