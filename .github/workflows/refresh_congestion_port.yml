name: Refresh Congestion & Port Particulars

# Weekly Oceanbolt -> Supabase refresh of congestion_timeseries and port_particulars.
# Runs after the tradeflows (03:00 UTC) and zones (05:00 UTC, up to 350 min) refreshes so they never
# compete for Oceanbolt's rate limit.

on:
  schedule:
    - cron: "0 11 * * 0"   # every Sunday at 11:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI
    inputs:
      days_back:
        description: "Congestion: days to re-fetch (ignored if start_date/end_date are set)"
        required: false
        default: "35"
      start_date:
        description: "Congestion backfill start, YYYY-MM-DD (set together with end_date)"
        required: false
        default: ""
      end_date:
        description: "Congestion backfill end, YYYY-MM-DD (set together with start_date)"
        required: false
        default: ""
      run_congestion:
        description: "Refresh congestion_timeseries"
        type: boolean
        default: true
      run_port_particulars:
        description: "Refresh port_particulars"
        type: boolean
        default: true
      full_port_particulars:
        description: "Port particulars: ignore what is in Supabase and re-fetch every window (slow: several hours)"
        type: boolean
        default: false

jobs:
  congestion:
    name: Congestion timeseries (Oceanbolt → Supabase)
    if: ${{ github.event_name == 'schedule' || inputs.run_congestion }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Refresh congestion_timeseries
        working-directory: automation
        env:
          OCEANBOLT_TOKEN: ${{ secrets.OCEANBOLT_TOKEN }}
          SUPABASE_URL: https://lsyombbeyjokpndczvdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REFRESH_DAYS_BACK: ${{ github.event.inputs.days_back || '35' }}
          REFRESH_START_DATE: ${{ github.event.inputs.start_date }}
          REFRESH_END_DATE: ${{ github.event.inputs.end_date }}
        run: python refresh_congestion_timeseries.py

  port_particulars:
    name: Port particulars (Oceanbolt → Supabase)
    needs: congestion
    # run even when congestion failed or was skipped, so one problem does not block the other table
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_port_particulars) }}
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Refresh port_particulars
        working-directory: automation
        env:
          OCEANBOLT_TOKEN: ${{ secrets.OCEANBOLT_TOKEN }}
          SUPABASE_URL: https://lsyombbeyjokpndczvdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL_FLAG: ${{ inputs.full_port_particulars && '--full' || '' }}
        run: python refresh_port_particulars.py $FULL_FLAG
