name: Refresh Tradeflows Data

on:
  schedule:
    - cron: "0 3 * * 0"   # every Sunday at 03:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI
    inputs:
      days_back:
        description: "Days to look back (ignored if start_date/end_date are set)"
        required: false
        default: "60"
      start_date:
        description: "Backfill start date, YYYY-MM-DD (must be set together with end_date)"
        required: false
        default: ""
      end_date:
        description: "Backfill end date, YYYY-MM-DD (must be set together with start_date)"
        required: false
        default: ""

jobs:
  refresh:
    name: Oceanbolt → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run refresh
        env:
          OCEANBOLT_TOKEN: ${{ secrets.OCEANBOLT_TOKEN }}
          SUPABASE_URL: https://lsyombbeyjokpndczvdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REFRESH_DAYS_BACK: ${{ github.event.inputs.days_back || '60' }}
          REFRESH_START_DATE: ${{ github.event.inputs.start_date }}
          REFRESH_END_DATE: ${{ github.event.inputs.end_date }}
        run: python automation/refresh_tradeflows.py
