name: Refresh Tradeflows Data

on:
  schedule:
    - cron: "0 3 * * 0"   # every Sunday at 03:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI
    inputs:
      days_back:
        description: "Days to look back (default 60)"
        required: false
        default: "60"

jobs:
  refresh:
    name: Oceanbolt → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run refresh
        env:
          OCEANBOLT_TOKEN: ${{ secrets.OCEANBOLT_TOKEN }}
          SUPABASE_URL: https://lsyombbeyjokpndczvdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REFRESH_DAYS_BACK: ${{ github.event.inputs.days_back || '60' }}
        run: python automation/refresh_tradeflows.py
